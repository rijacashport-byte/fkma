/* Guirlande sur toute la largeur : le motif se répète selon la largeur de l'écran (sans étirement). */
function garlandSvg(W){var n=Math.max(1,Math.round(W/210)),w=n*400,u='',k;for(k=0;k<n;k++){u+='<use href="#gp" x="'+(k*400)+'"/>';}
  return '<svg viewBox="0 0 '+w+' 86" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Guirlande de Noël"><defs><g id="gp">'+GP+'</g></defs>'+u+GSL+'<g transform="translate('+(w-400)+' 0)">'+GSR+'</g></svg>';}
function drawGarland(){var g=document.getElementById('garland');if(g){g.innerHTML=garlandSvg(g.clientWidth||Math.min(window.innerWidth,880)-32);}}
var rzT=null;window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(drawGarland,150);});
var KINDS={hira:'Chant',sampana:'Groupe / Sampana',dihy:'Danse',tantara:'Saynète',fitenenana:'Message',media:'Autre'};
function kindLabel(k){return KINDS[k]||'Autre';}

var state=JSON.parse(document.getElementById('state').textContent);
var app=document.getElementById('app');
var edit=false,order=false,drag=null,dirty=false,delIdx=-1,focusId=null,msg='';
var done={};
try{JSON.parse(localStorage.getItem('fkma-noel-done')||'[]').forEach(function(x){done[x]=1;});}catch(e){}
function saveDone(){try{localStorage.setItem('fkma-noel-done',JSON.stringify(Object.keys(done)));}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toMin(s){var m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1])*60+(+m[2]):18*60;}
function fmt(n){n=((n%1440)+1440)%1440;var h=Math.floor(n/60),m=n%60;return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;}
function dur(n){var h=Math.floor(n/60),m=n%60;return h?(h+' h'+(m?' '+(m<10?'0':'')+m:'')):(m+' min');}
function durLabel(it){return (it.est?'~ ':'')+dur(it.mins);}
function times(){var t=toMin(state.start),rows=[];state.items.forEach(function(it){rows.push({s:t,e:t+it.mins});t+=it.mins;});return {rows:rows,end:t};}
function anyDone(){return Object.keys(done).length>0;}
/* Un passage sans titre s'affiche avec le nom ou le groupe ; le statut manquant (ancien programme) vaut « confirmé ». */
function mt(it){return it.title||it.who||'Passage';}
function mw(it){return it.title&&it.who?it.who:'';}
function isPend(it){return it.status==='pending';}
function nPend(){var p=0;state.items.forEach(function(it){if(isPend(it)){p++;}});return p;}


var db=null,fdb=null,live=null,canW=false,pinVal='',askPin=false,regie=false,resetAsk=false,q='',focusQ=false,remote=null;

/* busy() : l'utilisateur est en train d'écrire dans un champ, on ne redessine pas la page sous ses doigts. */
function busy(){var a=document.activeElement,i=a&&a.id;return !!(i&&(i==='q'||i==='start'||i.indexOf('a-')===0));}
/* liveOk() : le direct enregistré correspond bien au programme actuel (sinon c'est un reste d'un ancien programme). */
function liveOk(){
  if(!db||!live||live.cur==null){return false;}
  var items=state.items,n=items.length;if(!n){return false;}
  if(live.cur==='end'){var st=live.starts||{};return st['i'+items[n-1].id]!=null;}
  return items.some(function(x){return x.id===live.cur;});
}

function nowMin(){var d=new Date();return d.getUTCHours()*60+d.getUTCMinutes();}
function liveCalc(T){
  if(!db||!live||live.cur==null||edit||order||!liveOk()){return null;}
  var items=state.items,n=items.length,end=live.cur==='end',idx=-1,st=live.starts||{};
  if(end){idx=n;}else{for(var i=0;i<n;i++){if(items[i].id===live.cur){idx=i;break;}}}
  if(idx<0){return null;}
  var rows=[],prevE=0;
  for(var k=0;k<n;k++){
    var id=items[k].id,s,e;
    if(k<idx){s=st['i'+id]!=null?st['i'+id]:T.rows[k].s;var nid=k+1<n?items[k+1].id:null;e=(nid!=null&&st['i'+nid]!=null)?st['i'+nid]:s+items[k].mins;rows.push({s:s,e:e,st:'past'});}
    else if(k===idx){s=st['i'+id]!=null?st['i'+id]:T.rows[k].s;rows.push({s:s,e:s+items[k].mins,st:'cur'});}
    else{s=prevE;rows.push({s:s,e:s+items[k].mins,st:k===idx+1?'next':'future'});}
    prevE=rows[k].e;
  }
  return {rows:rows,idx:idx,end:end,delay:end?0:rows[idx].s-T.rows[idx].s,endAt:prevE};
}
function livePanel(T,LC,big){
  if(!db){return '';}
  var items=state.items,h='<section class="live'+(big?' big':'')+'" aria-live="polite"><div class="lk">En direct</div>';
  var started=liveOk();
  if(!started){h+='<div class="lt">Le programme n’a pas encore commencé</div><div class="ls">Début prévu à '+fmt(toMin(state.start))+(state.startOk?'':' (heure prévisionnelle)')+'</div>';}
  else if(!LC){h+='<div class="lt">Direct en pause</div><div class="ls">Termine la modification pour retrouver le suivi.</div>';}
  else if(LC.end){h+='<div class="lt">Programme terminé</div><div class="ls">Dernier passage commencé à '+fmt(LC.rows[items.length-1].s)+'.</div>';}
  else{
    var r=LC.rows[LC.idx],it=items[LC.idx],el=Math.max(0,nowMin()-r.s),d=LC.delay;
    h+='<div class="ls">Passage '+(LC.idx+1)+' sur '+items.length+(isPend(it)?' · à confirmer':'')+'</div><div class="lt">'+esc(mt(it))+'</div>';
    if(mw(it)){h+='<div class="lw">'+esc(mw(it))+'</div>';}
    if(it.note){h+='<div class="ls">'+esc(it.note)+'</div>';}
    h+='<div class="ls'+(el>it.mins?' over':'')+'">Commencé à '+fmt(r.s)+' · '+el+' / '+it.mins+' min</div>';
    h+='<span class="badge '+(d>0?'late':d<0?'early':'ontime')+'">'+(d>0?'+'+d+' min de retard':d<0?(-d)+' min d’avance':'À l’heure')+'</span>';
    var nx=items[LC.idx+1];
    h+='<div class="nx">'+(nx?'Ensuite : <b>'+esc(mt(nx))+'</b>'+(mw(nx)?' — '+esc(mw(nx)):'')+(isPend(nx)?' (à confirmer)':'')+' · vers '+fmt(LC.rows[LC.idx+1].s):'Dernier passage · fin prévue vers <b>'+fmt(LC.endAt)+'</b>')+'</div>';
  }
  h+='<div class="lc">';
  if(canW){
    if(!started){if(items.length){h+='<button class="primary go" data-a="lstart">Démarrer le programme</button>';}else{h+='<span class="ls">Ajoute d’abord des passages pour pouvoir démarrer.</span>';}}
    else{
      if(LC&&!LC.end){h+='<button class="primary go" data-a="lnext">Passage suivant ▶</button>';}
      if(LC){h+='<button data-a="lprev">◀ Revenir</button>';}
      if(resetAsk){h+='<button class="danger" data-a="lresetok">Confirmer la remise à zéro</button><button data-a="lresetno">Annuler</button>';}
      else{h+='<button data-a="lreset">Remettre à zéro</button>';}
    }
  }else if(askPin){h+='<input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Code d’accès" style="max-width:11em"><button class="primary" data-a="pinok">Valider</button><button data-a="pinno">Annuler</button>';}
  else{h+='<button data-a="pin">Accès maître de cérémonie</button>';}
  h+='<button data-a="regie">'+(big?'Quitter le mode régie':'Mode régie (grand écran)')+'</button></div></section>';
  return h;
}
async function lwrite(o){
  if(!fdb){return;}
  try{
    await fdb.ref('pw').remove();
    await fdb.ref().update({live:o,pw:pinVal});
    fdb.ref('pw').remove();
    msg='';setMsg();
  }catch(e){live=remote;canW=false;pinVal='';msg='Code incorrect ou accès refusé. Le direct n’a pas été modifié.';render();}
}
function liveAct(a){
  var items=state.items,n=items.length;if(!n){return;}
  var st=Object.assign({},(live&&live.starts)||{}),cur=live?live.cur:null,idx=-1,o=null,now=nowMin();
  if(cur!=null&&cur!=='end'){idx=items.findIndex(function(x){return x.id===cur;});}
  if(a==='lstart'||(a==='lnext'&&cur==null)){st={};st['i'+items[0].id]=now;o={cur:items[0].id,starts:st};}
  else if(a==='lnext'){
    if(idx<0){return;}
    if(idx+1<n){st['i'+items[idx+1].id]=now;o={cur:items[idx+1].id,starts:st};}else{o={cur:'end',starts:st};}
  }else if(a==='lprev'){
    if(cur==='end'){o={cur:items[n-1].id,starts:st};}
    else if(idx>0){delete st['i'+items[idx].id];o={cur:items[idx-1].id,starts:st};}
    else{o={cur:null,starts:{}};}
  }else if(a==='lresetok'){o={cur:null,starts:{}};resetAsk=false;}
  else if(a==='lreset'){resetAsk=true;render();return;}
  else if(a==='lresetno'){resetAsk=false;render();return;}
  if(o){live=o;render();lwrite(o);}
}

function updateTimes(){
  var T=times();
  app.querySelectorAll('.row').forEach(function(li,i){
    var r=T.rows[i];if(!r){return;}
    li.querySelector('.t-start').textContent=fmt(r.s);
    li.querySelector('.t-end').textContent='→ '+fmt(r.e);
  });
  var e=document.getElementById('s-end'),t=document.getElementById('s-total'),sc=document.getElementById('sc-time'),ss=document.getElementById('s-start');

}

async function save(okMsg){
  if(!fdb||!canW){msg='Entre d’abord le code (Accès maître de cérémonie).';setMsg();return;}
  msg='Enregistrement en cours…';setMsg();
  try{
    state.event=EVENT;
    await fdb.ref('pw').remove();
    await fdb.ref().update({program:JSON.stringify(state),pw:pinVal});
    fdb.ref('pw').remove();
    dirty=false;msg=(okMsg?okMsg+' ':'')+'Enregistré : tout le monde le voit maintenant.';render();
  }catch(e){canW=false;pinVal='';edit=false;order=false;msg='Code incorrect ou accès refusé. Rien n’a été enregistré (tes changements sont encore sur cet écran).';render();}
}
function addItem(){
  var who=(af.who||'').trim(),ttl=(af.title||'').trim();
  if(!who&&!ttl){msg='Écris au moins un nom ou un titre pour ajouter le passage.';focusAdd=true;render();return;}
  var it={id:state.nextId++,kind:af.kind,title:ttl,who:who,note:'',mins:Math.max(1,Math.min(600,parseInt(af.mins,10)||5)),est:!!af.est,status:af.status==='confirmed'?'confirmed':'pending'};
  var mus=(af.mus||'').trim();if(mus){it.mpitendry=mus;}
  if(af.mode){it.mode=af.mode;}
  state.items.push(it);
  af.who='';af.title='';af.mus='';
  markDirty();focusAdd=true;render();
  save('Ajouté : '+mt(it)+(isPend(it)?' (à confirmer).':' (confirmé).'));
}
function toggleDone(li){
  var it=state.items[+li.dataset.i];if(!it){return;}
  if(done[it.id]){delete done[it.id];}else{done[it.id]=1;}
  saveDone();render();
}

    if(a==='fixstart'){state.startOk=true;markDirty();render();save('Heure de début confirmée : '+fmt(toMin(state.start))+'.');}
    else if(a==='savestart'){markDirty();save('Heure prévisionnelle : '+fmt(toMin(state.start))+'.');}
    else if(a==='unfix'){state.startOk=false;markDirty();render();save('L’heure de début est de nouveau prévisionnelle.');}
    else if(a==='addtoggle'){addOpen=true;focusAdd=true;render();}
    else if(a==='addclose'){addOpen=false;render();}
    else if(a==='addok'){addItem();}
    else if(a==='confirm'||a==='unconfirm'){var ci=state.items[i];if(ci){ci.status=(a==='confirm')?'confirmed':'pending';markDirty();render();save((a==='confirm'?'Confirmé : ':'Remis à confirmer : ')+mt(ci)+'.');}}
    else if(a==='remove'){var rm=state.items.splice(i,1)[0];if(rm){lastRm={it:rm,i:i};markDirty();render();save('Passage retiré.');}}
    else if(a==='undo'){if(lastRm){state.items.splice(Math.min(lastRm.i,state.items.length),0,lastRm.it);var back=lastRm.it;lastRm=null;markDirty();render();save('Remis dans le programme : '+mt(back)+'.');}}
    else if(a==='pin'){askPin=true;render();var pi=document.getElementById('pin');if(pi){pi.focus();}}
    else if(a==='pinno'){askPin=false;render();}
    else if(a==='pinok'){var pe=document.getElementById('pin');if(pe&&pe.value){pinVal=pe.value.trim();canW=true;askPin=false;msg='Code enregistré sur cet appareil. Tu peux faire avancer le programme.';render();}}
    else if(a.charAt(0)==='l'&&a.length>3&&a!=='load'){liveAct(a);}
    else if(a==='regie'){regie=!regie;try{history.replaceState(null,'',regie?'#regie':location.pathname+location.search);}catch(x){}render();}
    else if(a==='order'){order=true;edit=false;delIdx=-1;render();}
    else if(a==='edit'){edit=true;order=false;delIdx=-1;render();}
    else if(a==='endedit'){edit=false;order=false;delIdx=-1;render();}
    else if(a==='save'){save();}
    else if(a==='uncheck'){done={};saveDone();render();}
    else if(a==='up'&&i>0){var x=state.items.splice(i,1)[0];state.items.splice(i-1,0,x);markDirty();render();}
    else if(a==='down'&&i<state.items.length-1){var y=state.items.splice(i,1)[0];state.items.splice(i+1,0,y);markDirty();render();}
    else if(a==='add'){var n=newItem();state.items.splice(i+1,0,n);focusId=n.id;markDirty();render();}
    else if(a==='addend'){var m=newItem();state.items.push(m);focusId=m.id;markDirty();render();}
    else if(a==='del'){delIdx=i;render();}
    else if(a==='delno'){delIdx=-1;render();}
    else if(a==='delok'){state.items.splice(i,1);delIdx=-1;markDirty();render();}
    return;
  }
  if(!edit){var row=e.target.closest('.row');if(row){toggleDone(row);}}
});
app.addEventListener('keydown',function(e){
  if(!edit&&(e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('row')){e.preventDefault();toggleDone(e.target);}
});
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){q=t.value;focusQ=true;render();return;}
  if(t.id==='start'){if(t.value){state.start=t.value;markDirty();updateTimes();}return;}
  if(t.id&&t.id.indexOf('a-')===0){af[t.id.slice(2)]=(t.type==='checkbox'?t.checked:t.value);return;}
  var f=t.dataset&&t.dataset.f;if(!f){return;}
  var li=t.closest('.row');var it=li&&state.items[+li.dataset.i];if(!it){return;}
  if(f==='est'){it.est=t.checked;}
  else if(f==='mins'){it.mins=Math.max(0,Math.min(600,parseInt(t.value,10)||0));}
  else if(f==='kind'||f==='status'){it[f]=t.value;markDirty();render();return;}
  else{it[f]=t.value;}
  markDirty();updateTimes();
});
function rowAt(x,y){var els=document.elementsFromPoint(x,y);for(var k=0;k<els.length;k++){var r=els[k].closest&&els[k].closest('.ord-row');if(r){return r;}}return null;}
function clearMarks(){app.querySelectorAll('.drop-before,.drop-after').forEach(function(el){el.classList.remove('drop-before','drop-after');});}
var scrollTimer=null,lastY=0;
function stopDrag(){drag=null;clearMarks();if(scrollTimer){clearInterval(scrollTimer);scrollTimer=null;}var d=app.querySelector('.dragging');if(d){d.classList.remove('dragging');}}
app.addEventListener('pointerdown',function(e){
  var g=e.target.closest&&e.target.closest('[data-grip]');if(!g||!order){return;}
  var li=g.closest('.ord-row');if(!li){return;}
  e.preventDefault();
  drag={from:+li.dataset.i,to:+li.dataset.i,after:false};
  li.classList.add('dragging');
  try{g.setPointerCapture(e.pointerId);}catch(x){}
  lastY=e.clientY;
  scrollTimer=setInterval(function(){if(!drag){return;}if(lastY<90){window.scrollBy(0,-14);}else if(lastY>window.innerHeight-90){window.scrollBy(0,14);}},30);
});
app.addEventListener('pointermove',function(e){
  if(!drag){return;}
  lastY=e.clientY;
  var r=rowAt(e.clientX,e.clientY);if(!r){return;}
  var rect=r.getBoundingClientRect();
  drag.to=+r.dataset.i;drag.after=e.clientY>rect.top+rect.height/2;
  clearMarks();r.classList.add(drag.after?'drop-after':'drop-before');
});
function endDrag(cancel){
  if(!drag){return;}
  var d=drag;stopDrag();
  if(cancel){return;}
  var to=d.to+(d.after?1:0);
  if(d.from<to){to-=1;}
  if(to===d.from){return;}
  var it=state.items.splice(d.from,1)[0];
  state.items.splice(to,0,it);
  markDirty();render();
}
app.addEventListener('pointerup',function(){endDrag(false);});
app.addEventListener('pointercancel',function(){endDrag(true);});
app.addEventListener('keydown',function(e){
  var g=e.target.closest&&e.target.closest('[data-grip]');if(!g||!order){return;}
  if(e.key!=='ArrowUp'&&e.key!=='ArrowDown'){return;}
  e.preventDefault();
  var i=+g.closest('.ord-row').dataset.i,j=i+(e.key==='ArrowUp'?-1:1);
  if(j<0||j>=state.items.length){return;}
  var it=state.items.splice(i,1)[0];state.items.splice(j,0,it);markDirty();render();
  var n=app.querySelectorAll('.ord-row')[j];if(n){var gg=n.querySelector('[data-grip]');if(gg){gg.focus();}}
});
render();
