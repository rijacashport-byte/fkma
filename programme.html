<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Programme FKMA 45 ans</title><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style><style id="pagestyle">
/* Thème de la célébration : fond blanc, bleu marine, or, logos FKMA et K45, bande aux couleurs de la Côte d'Ivoire. */
@import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap");
:root{
  --bg:#ffffff;--fg:#18213a;--muted:#55607a;--line:#d6dcec;--soft:#eef2fb;
  --accent:#1c3f8c;--accent-fg:#ffffff;--gold:#b8872a;--warn:#b3261e;--ok:#1f7a4d;
  --hira-bg:#e6edf9;--hira-fg:#1c3f8c;
  --sampana-bg:#e1f2ea;--sampana-fg:#0d5a46;
  --fiten-bg:#fbefd5;--fiten-fg:#7a4e07;
  --quiz-bg:#fbe3df;--quiz-fg:#8f2a1a;
  --media-bg:#eceff2;--media-fg:#3d4852;
  --display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10172b;--fg:#e8ecf7;--muted:#a3aecb;--line:#2a3555;--soft:#18213d;
    --accent:#8fb0f5;--accent-fg:#0b1430;--gold:#e0b25a;--warn:#ff8f7d;--ok:#6fd3a0;
    --hira-bg:#1f2d52;--hira-fg:#b4c9f7;
    --sampana-bg:#16342b;--sampana-fg:#8fdcc0;
    --fiten-bg:#3a2d12;--fiten-fg:#f1ca7f;
    --quiz-bg:#40201b;--quiz-fg:#ffb0a3;
    --media-bg:#222b3d;--media-fg:#b4bfd4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10172b;--fg:#e8ecf7;--muted:#a3aecb;--line:#2a3555;--soft:#18213d;
  --accent:#8fb0f5;--accent-fg:#0b1430;--gold:#e0b25a;--warn:#ff8f7d;--ok:#6fd3a0;
  --hira-bg:#1f2d52;--hira-fg:#b4c9f7;
  --sampana-bg:#16342b;--sampana-fg:#8fdcc0;
  --fiten-bg:#3a2d12;--fiten-fg:#f1ca7f;
  --quiz-bg:#40201b;--quiz-fg:#ffb0a3;
  --media-bg:#222b3d;--media-fg:#b4bfd4;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:880px;margin:0 auto;padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.head{padding-bottom:14px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{flex:none;width:76px;height:76px;border-radius:50%;background-color:#fff;background-size:contain;background-repeat:no-repeat;background-position:center}

.ttl{flex:1;min-width:0;text-align:center}
.eyebrow{margin:0 0 6px;font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(1.35rem,4.6vw,2.2rem);line-height:1.12;text-wrap:balance;color:var(--accent)}
.sub{margin:6px 0 0;color:var(--muted);font-size:.9rem}
.datebar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;margin:14px 0 0;font-size:.92rem;color:var(--muted)}
.pill{display:inline-block;border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;padding:3px 14px;font-weight:600}
.verse{margin:14px auto 0;max-width:34em;padding:2px 0 2px 14px;border-left:3px solid var(--gold);font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--fg)}
.verse small{display:block;margin-top:2px;font-style:normal;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-family:var(--body);font-weight:600}
.flag{display:grid;grid-template-columns:1fr 2fr;grid-template-rows:7px 7px;height:14px;margin-top:16px;border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.flag i:nth-child(1){grid-row:1/3;background:#fff}.flag i:nth-child(2){background:#fc3d32}.flag i:nth-child(3){background:#007e3a}
.meta{margin:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-block:1px solid var(--line);padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.sum{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;color:var(--muted);font-size:.92rem}
.sum b{color:var(--fg);font-variant-numeric:tabular-nums;font-size:1.05rem}
.start{display:flex;gap:8px;align-items:center}
.acts{display:flex;flex-wrap:wrap;gap:8px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px;font-weight:600}
button:hover{background:var(--soft)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.1)}
button.danger{color:var(--warn);border-color:var(--warn)}

<script id="code">
(function(){
var TITLE='Programme FKMA 45 ans';
var KINDS={hira:'Chant',sampana:'Sampana',fitenenana:'Discours',quiz:'Kahoot',media:'Autre'};
var MODES={playback:'Playback',karaoke:'Karaoké'};
var state=JSON.parse(document.getElementById('state').textContent);
var app=document.getElementById('app');
var edit=false,order=false,drag=null,dirty=false,delIdx=-1,focusId=null,msg='';
var done={};
try{JSON.parse(localStorage.getItem('fkma45-done')||'[]').forEach(function(x){done[x]=1;});}catch(e){}
function saveDone(){try{localStorage.setItem('fkma45-done',JSON.stringify(Object.keys(done)));}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toMin(s){var m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1])*60+(+m[2]):13*60;}
function fmt(n){n=((n%1440)+1440)%1440;var h=Math.floor(n/60),m=n%60;return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;}
function dur(n){var h=Math.floor(n/60),m=n%60;return h?(h+' h'+(m?' '+(m<10?'0':'')+m:'')):(m+' min');}
function durLabel(it){return (it.est?'~ ':'')+dur(it.mins);}
function times(){var t=toMin(state.start),rows=[];state.items.forEach(function(it){rows.push({s:t,e:t+it.mins});t+=it.mins;});return {rows:rows,end:t};}
function anyDone(){return Object.keys(done).length>0;}


var db=null,fdb=null,live=null,canW=false,pinVal='',askPin=false,regie=false,resetAsk=false,q='',focusQ=false,remote=null;
try{regie=location.hash==='#regie';}catch(e){}
function nowMin(){var d=new Date();return d.getUTCHours()*60+d.getUTCMinutes();}
function liveCalc(T){
  if(!db||!live||live.cur==null||edit||order){return null;}
  var items=state.items,n=items.length,end=live.cur==='end',idx=-1,st=live.starts||{};
  if(end){idx=n;}else{for(var i=0;i<n;i++){if(items[i].id===live.cur){idx=i;break;}}}
  if(idx<0){return null;}
  var rows=[],prevE=0;
  for(var k=0;k<n;k++){
    var id=items[k].id,s,e;
    if(k<idx){s=st['i'+id]!=null?st['i'+id]:T.rows[k].s;var nid=k+1<n?items[k+1].id:null;e=(nid!=null&&st['i'+nid]!=null)?st['i'+nid]:s+items[k].mins;rows.push({s:s,e:e,st:'past'});}
    else if(k===idx){s=st['i'+id]!=null?st['i'+id]:T.rows[k].s;rows.push({s:s,e:s+items[k].mins,st:'cur'});}
    else{s=prevE;rows.push({s:s,e:s+items[k].mins,st:k===idx+1?'next':'future'});}
    prevE=rows[k].e;
  }
  return {rows:rows,idx:idx,end:end,delay:end?0:rows[idx].s-T.rows[idx].s,endAt:prevE};
}
function livePanel(T,LC,big){
  if(!db){return '';}
  var items=state.items,h='<section class="live'+(big?' big':'')+'" aria-live="polite"><div class="lk">En direct</div>';
  var started=live&&live.cur!=null;
  if(!started){h+='<div class="lt">Le programme n’a pas encore commencé</div><div class="ls">Début prévu à '+fmt(toMin(state.start))+'</div>';}
  else if(!LC){h+='<div class="lt">Direct en pause</div><div class="ls">Termine la modification pour retrouver le suivi.</div>';}
  else if(LC.end){h+='<div class="lt">Programme terminé</div><div class="ls">Dernier passage commencé à '+fmt(LC.rows[items.length-1].s)+'.</div>';}
  else{
    var r=LC.rows[LC.idx],it=items[LC.idx],el=Math.max(0,nowMin()-r.s),d=LC.delay;
    h+='<div class="ls">Passage '+(LC.idx+1)+' sur '+items.length+'</div><div class="lt">'+esc(it.title)+'</div>';
    if(it.who){h+='<div class="lw">'+esc(it.who)+'</div>';}
    if(it.note){h+='<div class="ls">'+esc(it.note)+'</div>';}
    h+='<div class="ls'+(el>it.mins?' over':'')+'">Commencé à '+fmt(r.s)+' · '+el+' / '+it.mins+' min</div>';
    h+='<span class="badge '+(d>0?'late':d<0?'early':'ontime')+'">'+(d>0?'+'+d+' min de retard':d<0?(-d)+' min d’avance':'À l’heure')+'</span>';
    var nx=items[LC.idx+1];
    h+='<div class="nx">'+(nx?'Ensuite : <b>'+esc(nx.title)+'</b>'+(nx.who?' — '+esc(nx.who):'')+' · vers '+fmt(LC.rows[LC.idx+1].s):'Dernier passage · fin prévue vers <b>'+fmt(LC.endAt)+'</b>')+'</div>';
  }
  h+='<div class="lc">';
  if(canW){
    if(!started){h+='<button class="primary go" data-a="lstart">Démarrer le programme</button>';}
    else{
      if(LC&&!LC.end){h+='<button class="primary go" data-a="lnext">Passage suivant ▶</button>';}
      if(LC){h+='<button data-a="lprev">◀ Revenir</button>';}
      if(resetAsk){h+='<button class="danger" data-a="lresetok">Confirmer la remise à zéro</button><button data-a="lresetno">Annuler</button>';}
      else{h+='<button data-a="lreset">Remettre à zéro</button>';}
    }
  }else if(askPin){h+='<input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Code d’Ando" style="max-width:11em"><button class="primary" data-a="pinok">Valider</button><button data-a="pinno">Annuler</button>';}
  else{h+='<button data-a="pin">Accès maître de cérémonie</button>';}
  h+='<button data-a="regie">'+(big?'Quitter le mode régie':'Mode régie (grand écran)')+'</button></div></section>';
  return h;
}
async function lwrite(o){
  if(!fdb){return;}
  try{
    await fdb.ref('pw').remove();
    await fdb.ref().update({live:o,pw:pinVal});
    fdb.ref('pw').remove();
    msg='';setMsg();
  }catch(e){live=remote;canW=false;pinVal='';msg='Code incorrect ou accès refusé. Le direct n’a pas été modifié.';render();}
}
function liveAct(a){
  var items=state.items,n=items.length;if(!n){return;}
  var st=Object.assign({},(live&&live.starts)||{}),cur=live?live.cur:null,idx=-1,o=null,now=nowMin();
  if(cur!=null&&cur!=='end'){idx=items.findIndex(function(x){return x.id===cur;});}
  if(a==='lstart'||(a==='lnext'&&cur==null)){st={};st['i'+items[0].id]=now;o={cur:items[0].id,starts:st};}
  else if(a==='lnext'){
    if(idx<0){return;}
    if(idx+1<n){st['i'+items[idx+1].id]=now;o={cur:items[idx+1].id,starts:st};}else{o={cur:'end',starts:st};}
  }else if(a==='lprev'){
    if(cur==='end'){o={cur:items[n-1].id,starts:st};}
    else if(idx>0){delete st['i'+items[idx].id];o={cur:items[idx-1].id,starts:st};}
    else{o={cur:null,starts:{}};}
  }else if(a==='lresetok'){o={cur:null,starts:{}};resetAsk=false;}
  else if(a==='lreset'){resetAsk=true;render();return;}
  else if(a==='lresetno'){resetAsk=false;render();return;}
  if(o){live=o;render();lwrite(o);}
}

function mine(it){if(!q){return false;}var s=q.toLowerCase();return (it.title+' '+it.who+' '+it.note+' '+(it.mpitendry||'')).toLowerCase().indexOf(s)>=0;}
function render(){
  var T=times(),total=T.end-toMin(state.start),LC=liveCalc(T);
  if(regie&&db){app.innerHTML='<div class="wrap">'+livePanel(T,LC,true)+'</div>';return;}
  var h='<div class="wrap">';
  h+='<header class="head"><div class="brand"><div class="logo logo-f" role="img" aria-label="Logo FKMA Abidjan"></div><div class="ttl"><p class="eyebrow">Miomana amin’ny fihavin’ny Tompo</p><h1>Fankalazana faha 45 taonan’ny Fiangonana</h1><p class="sub">Fiangonana Kristiana Malagasy eto Abidjan</p></div><div class="logo logo-k" role="img" aria-label="K45, 1981 à 2026"></div></div>';
  h+='<div class="datebar"><span class="pill">Alahady 1 Novambra 2026</span><span>ITCJ Angré · Fandaharam-potoana mandritra ny tapak’andro hariva</span></div>';
  h+='<blockquote class="verse">Fa Kristy no velona ato anatiko<small>C’est Christ qui vit en moi · Galatiana 2,20</small></blockquote>';
  h+='<div class="flag"><i></i><i></i><i></i></div></header>';
  h+=livePanel(T,LC,false);
  h+='<div class="bar"><div class="sum">';
  if(edit){h+='<label class="start" for="start">Début <input id="start" type="time" value="'+esc(state.start)+'"></label>';}
  else{h+='<span>Début <b>'+fmt(toMin(state.start))+'</b></span>';}
  h+='<span>Fin prévue <b id="s-end">'+fmt(T.end)+'</b></span>';
  h+='<span>Durée <b id="s-total">'+dur(total)+'</b></span>';
  h+='<span>'+state.items.length+' passages</span></div><div class="acts">';
  h+='<button class="primary" id="btn-save" data-a="save"'+(dirty?'':' hidden')+'>Enregistrer</button>';
  if(edit||order){h+='<button data-a="endedit">Terminer</button>';}
  else{
    if(anyDone()){h+='<button data-a="uncheck">Tout décocher</button>';}
    if(canW){h+='<button data-a="order">Réorganiser</button><button data-a="edit">Modifier</button>';}
  }
  h+='</div></div>';
  h+='<p class="msg" id="msg" role="status">'+esc(msg)+'</p>';
  h+='<p class="legend">'+(order?'Garde le doigt (ou la souris) sur la poignée ⠇ d’un passage et glisse-le à sa nouvelle place. Les numéros et les heures se recalculent seuls. Clique ensuite sur Enregistrer.':edit?'Change les titres, les durées et l’ordre. Les heures se recalculent seules. Clique sur Enregistrer pour que le maître de cérémonie voie la nouvelle version.':'Touche une ligne pour la marquer comme faite. Une durée précédée de ~ est une estimation à confirmer.')+'</p>';
  if(!edit&&!order){h+='<label class="find">Mon passage <input id="q" type="search" placeholder="Mon sampana ou mon nom" value="'+esc(q)+'"></label>';}
  h+='<ol>';
  state.items.forEach(function(it,i){
    var r=T.rows[i];
    var lr=LC&&LC.rows[i],shown=lr||r;
    var time='<div class="time"><span class="num">N° '+(i+1)+'</span><span class="t-start">'+fmt(shown.s)+'</span><span class="t-end">→ '+fmt(shown.e)+'</span>'+(lr&&lr.s!==r.s?'<span class="t-plan">prévu '+fmt(r.s)+'</span>':'')+'</div>';
    if(order){h+='<li class="ord-row k-'+it.kind+'" data-i="'+i+'"><span class="grip" data-grip="1" role="button" tabindex="0" aria-label="Déplacer le passage '+(i+1)+'">⠿</span><span class="ord-t">N° '+(i+1)+' · '+fmt(r.s)+'</span><span class="ord-title">'+esc(it.title)+(it.who?' — '+esc(it.who):'')+'</span><span class="dur'+(it.est?' est':'')+'">'+durLabel(it)+'</span></li>';return;}
    if(!edit){
      h+='<li class="row k-'+it.kind+(done[it.id]?' done':'')+(LC?' lv-'+LC.rows[i].st:'')+(mine(it)?' mine':'')+'" data-i="'+i+'" tabindex="0" role="button" aria-pressed="'+(done[it.id]?'true':'false')+'">'+time;
      h+='<div class="main"><span class="chip">'+KINDS[it.kind]+'</span><div class="title">'+esc(it.title)+'</div>';
      if(it.who){h+='<div class="who">'+esc(it.who)+'</div>';}
      if(it.mpitendry||it.mode){h+='<div class="mus"><span class="lbl">Mpitendry</span>'+esc(it.mpitendry||'—')+(it.mode?'<span class="mode m-'+esc(it.mode)+'">'+esc(MODES[it.mode]||it.mode)+'</span>':'')+'</div>';}
      if(mine(it)){var ci=LC?LC.idx:-1,dd=i-ci;h+='<div class="mineinfo">'+(LC&&LC.end?'Programme terminé':(LC&&dd<0)?'Déjà passé':dd===0?'C’est maintenant !':dd===1?'Prochain passage : prépare-toi !':'Encore '+(dd-1)+' passages avant toi · vers '+fmt(shown.s))+'</div>';}
      if(it.note){h+='<div class="note">'+esc(it.note)+'</div>';}
      else if(it.kind==='sampana'){h+='<div class="note todo">Animation à préciser</div>';}
      h+='</div><div class="dur'+(it.est?' est':'')+'">'+durLabel(it)+'</div></li>';
    }else{
      var p='f-'+it.id+'-';
      h+='<li class="row edit k-'+it.kind+'" data-i="'+i+'">'+time+'<div class="fields">';
      h+='<label for="'+p+'title">Titre<input id="'+p+'title" data-f="title" value="'+esc(it.title)+'"></label>';
      h+='<label for="'+p+'who">Qui passe<input id="'+p+'who" data-f="who" value="'+esc(it.who)+'" placeholder="Nom ou groupe"></label>';
      h+='<label for="'+p+'note">Détails de l’animation<input id="'+p+'note" data-f="note" value="'+esc(it.note)+'" placeholder="Ce qui sera présenté"></label>';
      h+='<label for="'+p+'mpitendry">Mpitendry (musicien)<input id="'+p+'mpitendry" data-f="mpitendry" value="'+esc(it.mpitendry)+'" placeholder="Nom du musicien"></label>';
      h+='<label for="'+p+'mode">Accompagnement<select id="'+p+'mode" data-f="mode"><option value=""'+(!it.mode?' selected':'')+'>Non précisé</option><option value="playback"'+(it.mode==='playback'?' selected':'')+'>Playback</option><option value="karaoke"'+(it.mode==='karaoke'?' selected':'')+'>Karaoké</option></select></label>';
      h+='<div class="line"><label for="'+p+'mins">Durée (min)<input id="'+p+'mins" data-f="mins" type="number" min="0" max="600" step="1" value="'+it.mins+'"></label>';
      h+='<label for="'+p+'kind">Type<select id="'+p+'kind" data-f="kind">';
      Object.keys(KINDS).forEach(function(k){h+='<option value="'+k+'"'+(it.kind===k?' selected':'')+'>'+KINDS[k]+'</option>';});
      h+='</select></label>';
      h+='<label class="chk" for="'+p+'est"><input id="'+p+'est" data-f="est" type="checkbox"'+(it.est?' checked':'')+'> Durée à confirmer (estimation)</label></div></div>';
      h+='<div class="tools"><button data-a="up" aria-label="Monter"'+(i===0?' disabled':'')+'>↑ Monter</button>';
      h+='<button data-a="down" aria-label="Descendre"'+(i===state.items.length-1?' disabled':'')+'>↓ Descendre</button>';
      h+='<button data-a="add">+ Ligne dessous</button>';
      if(delIdx===i){h+='<button class="danger" data-a="delok">Confirmer</button><button data-a="delno">Annuler</button>';}
      else{h+='<button data-a="del">Supprimer</button>';}
      h+='</div></li>';
    }
  });
  h+='</ol>';
  h+='<footer class="foot">FKMA · Culte d’action de grâce · 01.11.2026</footer>';
  if(edit){h+='<button class="add" data-a="addend">+ Ajouter un passage à la fin</button>';}
  h+='</div>';
  app.innerHTML=h;
  if(focusQ){focusQ=false;var qe=document.getElementById('q');if(qe){qe.focus();try{qe.setSelectionRange(q.length,q.length);}catch(x){}}}
  if(focusId){var el=document.getElementById('f-'+focusId+'-title');focusId=null;if(el){el.focus();el.select();}}
}
function setMsg(){var m=document.getElementById('msg');if(m){m.textContent=msg;}}
function markDirty(){dirty=true;var b=document.getElementById('btn-save');if(b){b.hidden=false;}}
function updateTimes(){
  var T=times();
  app.querySelectorAll('.row').forEach(function(li,i){
    var r=T.rows[i];if(!r){return;}
    li.querySelector('.t-start').textContent=fmt(r.s);
    li.querySelector('.t-end').textContent='→ '+fmt(r.e);
  });
  var e=document.getElementById('s-end'),t=document.getElementById('s-total');
  if(e){e.textContent=fmt(T.end);}
  if(t){t.textContent=dur(T.end-toMin(state.start));}
}
function newItem(){return {id:state.nextId++,kind:'hira',title:'Nouveau passage',who:'',note:'',mins:5,est:true};}
function buildDoc(){
  var css=document.getElementById('pagestyle').textContent;
  var code=document.getElementById('code').textContent;
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  var reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    +'<title>'+TITLE+'</title><style id="pagestyle">'+css+'</style><div id="app"></div>'
    +'<script type="application/json" id="state">'+json+'<\/script><script id="code">'+code+'<\/script></body></html>';
}
async function save(){
  if(!fdb||!canW){msg='Entre d’abord le code (Accès maître de cérémonie).';setMsg();return;}
  msg='Enregistrement en cours…';setMsg();
  try{
    await fdb.ref('pw').remove();
    await fdb.ref().update({program:JSON.stringify(state),pw:pinVal});
    fdb.ref('pw').remove();
    dirty=false;msg='Programme enregistré : tout le monde le voit maintenant.';render();
  }catch(e){canW=false;pinVal='';edit=false;order=false;msg='Code incorrect ou accès refusé. Rien n’a été enregistré (tes changements sont encore sur cet écran).';render();}
}
function toggleDone(li){
  var it=state.items[+li.dataset.i];if(!it){return;}
  if(done[it.id]){delete done[it.id];}else{done[it.id]=1;}
  saveDone();render();
}
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');
  if(b){
    var a=b.dataset.a,li=b.closest('.row'),i=li?+li.dataset.i:-1;
    if(a==='pin'){askPin=true;render();var pi=document.getElementById('pin');if(pi){pi.focus();}}
    else if(a==='pinno'){askPin=false;render();}
    else if(a==='pinok'){var pe=document.getElementById('pin');if(pe&&pe.value){pinVal=pe.value.trim();canW=true;askPin=false;msg='Code enregistré sur cet appareil. Tu peux faire avancer le programme.';render();}}
    else if(a.charAt(0)==='l'&&a.length>3&&a!=='load'){liveAct(a);}
    else if(a==='regie'){regie=!regie;try{history.replaceState(null,'',regie?'#regie':location.pathname+location.search);}catch(x){}render();}
    else if(a==='order'){order=true;edit=false;delIdx=-1;render();}
    else if(a==='edit'){edit=true;order=false;delIdx=-1;render();}
    else if(a==='endedit'){edit=false;order=false;delIdx=-1;render();}
    else if(a==='save'){save();}
    else if(a==='uncheck'){done={};saveDone();render();}
    else if(a==='up'&&i>0){var x=state.items.splice(i,1)[0];state.items.splice(i-1,0,x);markDirty();render();}
    else if(a==='down'&&i<state.items.length-1){var y=state.items.splice(i,1)[0];state.items.splice(i+1,0,y);markDirty();render();}
    else if(a==='add'){var n=newItem();state.items.splice(i+1,0,n);focusId=n.id;markDirty();render();}
    else if(a==='addend'){var m=newItem();state.items.push(m);focusId=m.id;markDirty();render();}
    else if(a==='del'){delIdx=i;render();}
    else if(a==='delno'){delIdx=-1;render();}
    else if(a==='delok'){state.items.splice(i,1);delIdx=-1;markDirty();render();}
    return;
  }
  if(!edit){var row=e.target.closest('.row');if(row){toggleDone(row);}}
});
app.addEventListener('keydown',function(e){
  if(!edit&&(e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('row')){e.preventDefault();toggleDone(e.target);}
});
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){q=t.value;focusQ=true;render();return;}
  if(t.id==='start'){if(t.value){state.start=t.value;markDirty();updateTimes();}return;}
  var f=t.dataset&&t.dataset.f;if(!f){return;}
  var li=t.closest('.row');var it=li&&state.items[+li.dataset.i];if(!it){return;}
  if(f==='est'){it.est=t.checked;}
  else if(f==='mins'){it.mins=Math.max(0,Math.min(600,parseInt(t.value,10)||0));}
  else if(f==='kind'){it.kind=t.value;markDirty();render();return;}
  else{it[f]=t.value;}
  markDirty();updateTimes();
});
function rowAt(x,y){var els=document.elementsFromPoint(x,y);for(var k=0;k<els.length;k++){var r=els[k].closest&&els[k].closest('.ord-row');if(r){return r;}}return null;}
function clearMarks(){app.querySelectorAll('.drop-before,.drop-after').forEach(function(el){el.classList.remove('drop-before','drop-after');});}
var scrollTimer=null,lastY=0;
function stopDrag(){drag=null;clearMarks();if(scrollTimer){clearInterval(scrollTimer);scrollTimer=null;}var d=app.querySelector('.dragging');if(d){d.classList.remove('dragging');}}
app.addEventListener('pointerdown',function(e){
  var g=e.target.closest&&e.target.closest('[data-grip]');if(!g||!order){return;}
  var li=g.closest('.ord-row');if(!li){return;}
  e.preventDefault();
  drag={from:+li.dataset.i,to:+li.dataset.i,after:false};
  li.classList.add('dragging');
  try{g.setPointerCapture(e.pointerId);}catch(x){}
  lastY=e.clientY;
  scrollTimer=setInterval(function(){if(!drag){return;}if(lastY<90){window.scrollBy(0,-14);}else if(lastY>window.innerHeight-90){window.scrollBy(0,14);}},30);
});
app.addEventListener('pointermove',function(e){
  if(!drag){return;}
  lastY=e.clientY;
  var r=rowAt(e.clientX,e.clientY);if(!r){return;}
  var rect=r.getBoundingClientRect();
  drag.to=+r.dataset.i;drag.after=e.clientY>rect.top+rect.height/2;
  clearMarks();r.classList.add(drag.after?'drop-after':'drop-before');
});
function endDrag(cancel){
  if(!drag){return;}
  var d=drag;stopDrag();
  if(cancel){return;}
  var to=d.to+(d.after?1:0);
  if(d.from<to){to-=1;}
  if(to===d.from){return;}
  var it=state.items.splice(d.from,1)[0];
  state.items.splice(to,0,it);
  markDirty();render();
}
app.addEventListener('pointerup',function(){endDrag(false);});
app.addEventListener('pointercancel',function(){endDrag(true);});
app.addEventListener('keydown',function(e){
  var g=e.target.closest&&e.target.closest('[data-grip]');if(!g||!order){return;}
  if(e.key!=='ArrowUp'&&e.key!=='ArrowDown'){return;}
  e.preventDefault();
  var i=+g.closest('.ord-row').dataset.i,j=i+(e.key==='ArrowUp'?-1:1);
  if(j<0||j>=state.items.length){return;}
  var it=state.items.splice(i,1)[0];state.items.splice(j,0,it);markDirty();render();
  var n=app.querySelectorAll('.ord-row')[j];if(n){var gg=n.querySelector('[data-grip]');if(gg){gg.focus();}}
});
render();
setInterval(function(){if(live&&live.cur!=null&&!edit&&!order&&!askPin&&document.activeElement.id!=='q'){render();}},20000);

    fdb=firebase.database();db=true;

    fdb.ref('program').on('value',function(s){var v=s.val();if(typeof v==='string'&&!dirty&&!edit&&!order){try{var j=JSON.parse(v);if(j&&j.items&&j.items.length){state=j;}}catch(x){}render();}},function(){});
    render();
  }catch(e){}
})();
