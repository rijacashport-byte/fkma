<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body>
<title>Inscription 1er Novembre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : une colonne, bandeau de totaux en haut, formulaire puis liste des inscrits */
:root{--bg:#EEF2F7;--surface:#FFFFFF;--ink:#14233B;--muted:#5A6B84;--line:#D5DDE8;--accent:#1B4F94;--accent-ink:#FFFFFF;--soft:#E3ECF8;--gold:#9A6A00;--gold-soft:#FBF0D2;--bad:#B3382C;--bad-soft:#FBE9E6;--good:#1E7A4C;--good-soft:#E2F4EA;
--display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1624;--surface:#15233A;--ink:#EAF0F8;--muted:#9DB0CA;--line:#2A3D5B;--accent:#7FB2EE;--accent-ink:#0D1624;--soft:#1D3354;--gold:#F0C25C;--gold-soft:#3A2F12;--bad:#F2917F;--bad-soft:#3A2321;--good:#62C592;--good-soft:#16352A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1624;--surface:#15233A;--ink:#EAF0F8;--muted:#9DB0CA;--line:#2A3D5B;--accent:#7FB2EE;--accent-ink:#0D1624;--soft:#1D3354;--gold:#F0C25C;--gold-soft:#3A2F12;--bad:#F2917F;--bad-soft:#3A2321;--good:#62C592;--good-soft:#16352A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);margin:0;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
header{display:flex;gap:12px;align-items:center}
header img{width:52px;height:52px;flex:none}
h1{font:700 1.45rem/1.15 var(--display);margin:0;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.totals{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile b{display:block;font:700 2.6rem/1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:.9rem;opacity:.9}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font:700 1.15rem/1.2 var(--display);margin:0}
label{font-weight:600;font-size:.92rem;display:block;margin-bottom:5px}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],select{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:52px;height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:1.6rem;font-weight:700;cursor:pointer}
.stepper input{width:84px;text-align:center;font:700 1.7rem var(--display);min-height:52px;font-variant-numeric:tabular-nums;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.hint{color:var(--muted);font-size:.85rem;margin:4px 0 0}
.btn{min-height:52px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.05rem;cursor:pointer;padding:0 18px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);min-height:44px;font-size:.95rem}
.msg{min-height:1.3em;font-size:.92rem;margin:0}
.msg.ok{color:var(--good)}.msg.err{color:var(--bad)}
.banner{background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:.9rem}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toggle{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:8px 4px;min-height:44px}
.rows{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.row .nm{font-weight:600;overflow-wrap:anywhere}
.row .nt{grid-column:1;color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.pill{background:var(--soft);color:var(--ink);border-radius:999px;padding:4px 12px;font:700 1.05rem var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:.72rem;font-weight:700;background:var(--gold-soft);color:var(--gold);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.acts{grid-column:2;grid-row:1 / span 2;display:flex;gap:6px;align-items:center}
.row .acts{grid-row:1}
.mini{min-height:40px;min-width:40px;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;cursor:pointer;font-weight:600;font-size:.88rem;padding:0 10px}
.mini.del{color:var(--bad);border-color:var(--bad)}
.empty{color:var(--muted);padding:14px 0;text-align:center}
.two{display:grid;grid-template-columns:1fr 112px;gap:10px;align-items:end}
.two input[type=text]{width:100%}
.foot{display:flex;gap:10px;flex-wrap:wrap}
.foot .btn{flex:1;min-width:150px}
[hidden]{display:none!important}
@media (max-width:420px){.totals{grid-template-columns:1fr 1fr}.tile b{font-size:2.2rem}}
@media (prefers-reduced-motion:no-preference){.row{transition:background .3s}.row.flash{background:var(--good-soft)}}
</style>

const $=id=>document.getElementById(id);
const OTHER='__autre__';
let lastSel='',insc=new Map(),db=null,canWrite=true,local=false,editing=null,busy=false,open=true;
const LSK='insc_1nov_2026';
const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,60);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(t,cls,el){const m=$(el||'msg');m.textContent=t||'';m.className='msg '+(cls||'')}
function memberId(isa){return 'm'+isa}

/* ---- stockage : base partagée si disponible, sinon cet appareil ---- */
function lsLoad(){try{return JSON.parse(localStorage.getItem(LSK)||'[]')}catch(e){return []}}
function lsSave(){try{localStorage.setItem(LSK,JSON.stringify([...insc].map(([id,v])=>({id,...v}))))}catch(e){}}
let unsub=null;
const COL='inscription_1nov';
function ref(id){return doc(fdb,COL,id)}
async function put(id,rec){
  if(local){insc.set(id,rec);lsSave();render();return}
  await setDoc(ref(id),rec);
}
async function del(id){
  const r=insc.get(id);if(!r)return;
  if(local){insc.delete(id);lsSave();render();return}
  await setDoc(ref(id),{...r,nb:0,at:Date.now()});
}

/* ---- formulaire ---- */
function buildSelect(keep){
  const s=$('sel'),q=norm($('q').value);
  const cur=keep!==undefined?keep:s.value;
  let h='<option value="">— Choisir un membre —</option>';
  const list=MEMBRES.filter(m=>!q||norm(m[1]).includes(q));
  list.forEach(m=>{const done=insc.has(memberId(m[0]));h+=`<option value="${m[0]}">${esc(m[1])}${done?'  ✓ inscrit':''}</option>`});
  [...insc].filter(([id,v])=>v.extra&&(!q||norm(v.nom).includes(q))).forEach(([id,v])=>{h+=`<option value="${esc(id)}">${esc(v.nom)}  ✓ inscrit (ajouté)</option>`});
  h+=`<option value="${OTHER}">➕ Autre personne (pas dans la liste)</option>`;
  s.innerHTML=h;
  if([...s.options].some(o=>o.value===cur))s.value=cur;
  const n=list.length;
  $('selHint').textContent=q?(n?`${n} nom${n>1?'s':''} correspond${n>1?'ent':''}.`:'Aucun nom ne correspond : choisis « Autre personne » pour l\'ajouter.'):'';
  onSel();
}
function onSel(){
  const v=$('sel').value;
  $('otherBox').hidden=v!==OTHER;
  if(editing)return;
  if(v===lastSel)return;lastSel=v;
  const rec=v&&v!==OTHER?(insc.get(/^\d+$/.test(v)?memberId(v):v)):null;
  if(rec){$('nb').value=rec.nb;$('note').value=rec.note||'';$('cov').value=rec.cov?rec.cov:'';$('formTitle').textContent='Cette personne est déjà inscrite';$('save').textContent='Modifier l\'inscription';say('Déjà inscrit pour '+rec.nb+' personne'+(rec.nb>1?'s':'')+'. Change le nombre puis enregistre.','')}
  else{$('formTitle').textContent='Nouvelle inscription';$('save').textContent='Enregistrer l\'inscription';if(!busy)say('')}
}
function setNb(n){n=Math.max(1,Math.min(50,Math.round(+n)||1));$('nb').value=n}
function resetForm(){editing=null;lastSel='';$('q').value='';$('other').value='';$('note').value='';$('cov').value='';setNb(1);$('cancel').hidden=true;buildSelect('');$('sel').value=''}
function startEdit(id){
  const r=insc.get(id);if(!r)return;editing=id;lastSel='';
  $('q').value='';
  if(r.extra){buildSelect(id)}else{buildSelect(String(r.isa))}
  $('otherBox').hidden=true;
  $('nb').value=r.nb;$('note').value=r.note||'';$('cov').value=r.cov?r.cov:'';
  $('formTitle').textContent='Modifier : '+r.nom;$('save').textContent='Enregistrer la modification';$('cancel').hidden=false;
  say('');window.scrollTo({top:0,behavior:'smooth'});
}
$('form').addEventListener('submit',async e=>{
  e.preventDefault();if(busy)return;
  if(!canWrite){say('Tu peux seulement consulter cette liste. Demande l\'accès en modification.','err');return}
  const v=$('sel').value;let id,nom,isa=null,extra=false;
  if(editing){const r=insc.get(editing);id=editing;nom=r.nom;isa=r.isa??null;extra=!!r.extra}
  else if(!v){say('Choisis d\'abord un nom dans la liste.','err');$('sel').focus();return}
  else if(v===OTHER){nom=$('other').value.replace(/\s+/g,' ').trim();if(nom.length<2){say('Écris le nom de la personne à ajouter.','err');$('other').focus();return}
    id='x_'+(slug(nom)||Date.now());extra=true;const same=MEMBRES.find(m=>norm(m[1])===norm(nom));if(same){id=memberId(same[0]);isa=same[0];extra=false;nom=same[1]}}
  else if(/^\d+$/.test(v)){const m=MEMBRES.find(m=>String(m[0])===v);id=memberId(m[0]);nom=m[1];isa=m[0]}
  else{const r=insc.get(v);id=v;nom=r.nom;extra=true}
  const nb=Math.max(1,Math.min(50,Math.round(+$('nb').value)||1));
  const cov=Math.max(0,Math.min(50,Math.round(+String($('cov').value).replace(/[^0-9]/g,''))||0));
  const rec={nom,nb,note:$('note').value.trim().slice(0,120),cov,isa,extra,at:Date.now()};
  busy=true;$('save').disabled=true;say('Enregistrement…');
  try{await put(id,rec);say(nom+' : '+nb+' personne'+(nb>1?'s':'')+' enregistrée'+(nb>1?'s':'')+'.','ok');resetForm();flash(id)}
  catch(err){say(err&&err.code==='permission-denied'?'Enregistrement refusé. Les inscriptions sont peut-être closes.':'L\'enregistrement a échoué. Vérifie ta connexion et réessaie.','err')}
  finally{busy=false;$('save').disabled=false}
});
$('cancel').addEventListener('click',()=>{resetForm();say('')});
$('q').addEventListener('input',()=>buildSelect(''));
$('sel').addEventListener('change',onSel);
$('minus').addEventListener('click',()=>setNb(+$('nb').value-1));
$('plus').addEventListener('click',()=>setNb(+$('nb').value+1));
$('nb').addEventListener('change',()=>setNb($('nb').value));
$('nb').addEventListener('focus',e=>e.target.select());

/* ---- liste ---- */
let pendingDel=null,flashId=null;
function flash(id){flashId=id;render();setTimeout(()=>{flashId=null;const r=document.querySelector('.row.flash');if(r)r.classList.remove('flash')},1600)}
function sorted(){return [...insc].map(([id,v])=>({id,...v})).sort((a,b)=>a.nom.localeCompare(b.nom,'fr',{sensitivity:'base'}))}
function render(){
  const all=sorted();const pers=all.reduce((s,r)=>s+(+r.nb||0),0);
  $('tPers').textContent=pers;$('tInsc').textContent=all.length;
  $('listTitle').textContent='Inscrits ('+all.length+')';
  const covT=all.reduce((s,r)=>s+(+r.cov||0),0);const ct=$('covTot');ct.hidden=!covT;ct.textContent='🚗 Covoiturage demandé : '+covT+' personne'+(covT>1?'s':'');
  const f=norm($('f').value);const shown=all.filter(r=>!f||norm(r.nom).includes(f));
  const ul=$('rows');
  if(!all.length){ul.innerHTML='<li class="empty">Aucune inscription pour l\'instant. Choisis un nom dans la liste ci-dessus, indique le nombre de personnes, puis enregistre.</li>'}
  else if(!shown.length){ul.innerHTML='<li class="empty">Aucun inscrit ne correspond à ce filtre.</li>'}
  else ul.innerHTML=shown.map(r=>{
    const conf=pendingDel===r.id;
    return `<li class="row${flashId===r.id?' flash':''}"><div class="nm">${esc(r.nom)}${r.extra?'<span class="tag">ajouté</span>':''}</div>
    <div class="acts"><span class="pill" title="Nombre de personnes">${r.nb}</span>${canWrite?(conf?`<button class="mini del" data-a="yes" data-id="${esc(r.id)}">Retirer</button><button class="mini" data-a="no">Non</button>`:`<button class="mini" data-a="edit" data-id="${esc(r.id)}" aria-label="Modifier ${esc(r.nom)}">Modifier</button><button class="mini del" data-a="ask" data-id="${esc(r.id)}" aria-label="Retirer ${esc(r.nom)}">✕</button>`):''}</div>
    ${(r.note||r.cov)?`<div class="nt">${r.cov?'🚗 Covoiturage : '+(+r.cov)+(r.note?' · ':''):''}${esc(r.note||'')}</div>`:''}</li>`}).join('');
  buildSelectKeep();
}
function buildSelectKeep(){if(!editing&&!$('q').value){const v=$('sel').value;buildSelect(v)}else{const v=$('sel').value;buildSelect(v)}}
$('rows').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='edit')startEdit(id);
  else if(a==='ask'){pendingDel=id;render()}
  else if(a==='no'){pendingDel=null;render()}
  else if(a==='yes'){pendingDel=null;try{await del(id);say('Inscription retirée.','ok','msg2')}catch(err){say('Impossible de retirer cette inscription.','err','msg2');render()}}
});
$('f').addEventListener('input',render);
$('tgl').addEventListener('click',()=>{open=!open;$('listBox').hidden=!open;$('tgl').textContent=open?'Réduire':'Afficher';$('tgl').setAttribute('aria-expanded',open)});

/* ---- export ---- */
function textList(){const all=sorted();const pers=all.reduce((s,r)=>s+r.nb,0);
  return 'Inscriptions du 1er novembre 2026 (45ᵉ anniversaire FKMA, ITCJ Angré)\nTotal : '+pers+' personnes, '+all.length+' inscriptions\n\n'+all.map(r=>'- '+r.nom+' : '+r.nb+(r.cov?' [covoiturage '+r.cov+']':'')+(r.note?' ('+r.note+')':'')).join('\n')}
$('copy').addEventListener('click',async()=>{
  const t=textList();
  try{await navigator.clipboard.writeText(t);say('Liste copiée. Tu peux la coller dans WhatsApp.','ok','msg2')}
  catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='width:100%;height:160px;margin-top:8px';$('listBox').appendChild(ta);ta.select();say('Copie impossible ici : le texte est sélectionné, copie-le à la main.','','msg2')}
});
$('csv').addEventListener('click',async()=>{
  const all=sorted();if(!all.length){say('Rien à télécharger pour l\'instant.','err','msg2');return}
  const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"';
  const csv='﻿'+['Nom;Personnes;Covoiturage;Remarque;Origine'].concat(all.map(r=>[q(r.nom),r.nb,r.cov||0,q(r.note),r.extra?'ajouté':'liste'].join(';'))).join('\r\n')+'\r\nTOTAL;'+all.reduce((s,r)=>s+r.nb,0)+';'+all.reduce((s,r)=>s+(+r.cov||0),0)+';;';
  try{const bl=new Blob([csv],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(bl);const l=document.createElement('a');l.href=u;l.download='inscriptions_1er_novembre_2026.csv';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);say('Fichier prêt.','ok','msg2')}
  catch(e){say('Téléchargement impossible ici. Utilise « Copier la liste ».','err','msg2')}
});

function banner(){
  const bn=$('banner');
  if(local){bn.hidden=false;bn.textContent='Mode local : les inscriptions restent sur cet appareil et ne sont pas partagées. Vérifie ta connexion et recharge la page.'}
  else bn.hidden=true;
  render();
}
const SEED=[["m17","ANDRIAMBAHINY Patrick",5,17],["m18","ANDRIAMIADANA Mirintsoa",1,18],["m52","RABETRANO Hantasoanirina Josette",4,52],["m53","RABETSIMIALONA Ndriana",1,53],["m85","RAKOTOARIVONY Evah",2,85],["m89","RAKOTOMAHEFA Lewis",2,89],["m113","RAKOTOSON Rija",4,113],["m150","RAZAFIMAHATRA Mamy Rijason",7,150]];
let allIds=new Set();
function showApp(on){['form','totals','listCard'].forEach(i=>$(i).hidden=!on)}
function connect(){
  local=false;
  unsub=onSnapshot(collection(fdb,COL),snap=>{
    const m=new Map();allIds=new Set(snap.docs.map(x=>x.id));snap.docs.forEach(x=>{const v=x.data();if(v&&v.nom&&(+v.nb)>0)m.set(x.id,v)});insc=m;
    showApp(true);banner();
  },err=>{say('La liste ne se met plus à jour. Vérifie ta connexion et recharge la page.','err','msg2');showApp(true)});
}
if(new URLSearchParams(location.search).get('import')==='1')$('imp').hidden=false;
$('imp').addEventListener('click',async()=>{
  try{let n=0;for(const [id,nom,nb,isa] of SEED){if(!allIds.has(id)){await setDoc(ref(id),{nom,nb,note:'',cov:0,isa,extra:false,at:Date.now()});n++}}
    say(n?('Importé : '+n+' inscription'+(n>1?'s':'')+' ajoutée'+(n>1?'s':'')+'. Les autres existaient déjà et n\'ont pas été touchées.'):'Rien à importer : tout existe déjà.','ok','msg2')}catch(e){say('Import impossible.','err','msg2')}
});

/* ---- démarrage ---- */
buildSelect('');render();
showApp(true);connect();
})();
